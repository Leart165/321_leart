# Lokale Entwicklung: alles aus dem Quellcode gebaut.
#
#   docker compose up --build -d
#
name: transactions

services:
  transactions-api:
    build:
      context: .
      dockerfile: src/Auth.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Adresse des Kontendienstes (Repo m321 von Tim). Zeigt hier auf den Compose-Service-Namen,
      # falls beide Dienste im selben Netzwerk laufen; sonst anpassen (z.B. host.docker.internal).
      AccountsApi__BaseUrl: "http://accounts-api:8080"
    ports:
      - "8082:8080"
