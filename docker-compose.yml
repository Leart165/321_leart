# Lokale Entwicklung: Infrastruktur fuer Tests und dotnet run.
# Das Deployment des Gesamtsystems liegt im Shared-Repo m321-main.
#
#   docker compose up -d        Postgres und RabbitMQ, den Dienst dann mit dotnet run
#
# Der Dienst selbst kommt hier dazu, sobald es ein Dockerfile gibt (Schritt 4).
#
name: analytics

services:
  analyticsdb:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5435:5432"
    volumes:
      - analyticsdb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    hostname: analytics-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  analyticsdb-data:
