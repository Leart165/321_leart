# Lokale Entwicklung: alles aus dem Quellcode gebaut.
# Das Deployment des Gesamtsystems liegt im Shared-Repo m321-main.
#
#   docker compose up --build -d    einmal alles
#   docker compose up -d analyticsdb rabbitmq    nur Infrastruktur, Dienst mit dotnet run
#
name: analytics

services:
  analyticsdb:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5435:5432"
    volumes:
      - analyticsdb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    hostname: analytics-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  analytics-api:
    build:
      context: .
      dockerfile: src/Analytics.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__AnalyticsDb: "Host=analyticsdb;Port=5432;Database=analytics;Username=analytics;Password=analytics"
      RabbitMq__Host: rabbitmq
      Auth__Issuer: "https://auth.fischerfocus.com/realms/personal"
      Auth__Audience: "m321-analytics-api"
    ports:
      - "8082:8080"
    depends_on:
      analyticsdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  analyticsdb-data:
